# Standing security checks: static analysis, dependency audit, secret scan,
# and the existing Jest security tests. Nothing here calls a deployed site.
name: Security

on:
  pull_request:
  push:
    branches:
      - sec/audit-pipeline

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      # Report-only. Findings (and a non-zero scan exit) do not fail this job.
      # After the baseline is triaged, remove continue-on-error and add --error
      # to the semgrep command to block on findings.
      - name: Scan
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/typescript
          --config p/react
          --config p/nextjs

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL -o "gitleaks_${version}_linux_x64.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "gitleaks_${version}_checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${version}_checksums.txt"
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Detect secrets
        run: gitleaks detect --source . --redact --verbose

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Blocks on high and critical production advisories.
      # Rechecked 2026-10-13 after npm audit fix (no --force) plus same-major
      # overrides. Critical is clear. The job still fails. What remains:
      # - prisma, @prisma/config, deepmerge-ts: advisory range
      #   6.13.0-dev.1 - 8.1.0-dev.4. No forward release is outside it.
      #   npm's only fix is prisma@6.12.0, a downgrade. We will not downgrade.
      #   prisma and @prisma/client stay on ^6.16.1.
      # - nanoid 4.0.2 under @excalidraw/excalidraw (mermaid-to-excalidraw).
      #   No 4.x patch (fixes are 3.3.20 and 5.1.16). npm's fix downgrades
      #   excalidraw to 0.17.6. We will not downgrade. The 3.3.3 pin is
      #   overridden to 3.3.20.
      # - nodemailer 7.0.13, which also flags next-auth. 10.1.0 dropped the
      #   nodemailer.Transporter namespace and next build failed. Bump reverted.
      # - pdfjs-dist 5.7.284. 6.4.299 removed PDFDocumentProxy.destroy and
      #   next build failed. Bump reverted. The PDF path was not reworked.
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  jest-security:
    name: Jest security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Only src/__tests__/security. Those tests mock the database and do not
      # need a live database. Do not widen this to the full Jest suite or
      # Playwright: Jest global setup resets the shared test database.
      - name: Run security tests
        run: npx jest src/__tests__/security
